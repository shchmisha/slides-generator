# Shared by every /api location in nginx.conf.
limit_req zone=api burst=40 nodelay;
# Through a variable, so the name is resolved at request time (see `resolver` in nginx.conf).
set $api_upstream http://api:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, never append: a client-sent X-Forwarded-For must not choose the IP the API
# rate-limits by.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
