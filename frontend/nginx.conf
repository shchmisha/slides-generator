# Single public entry point: static UI + reverse proxy to the API on the same origin,
# so auth cookies need no CORS.

# Every /api request is rate-limited per client IP at the edge (sign-in, uploads and job starts
# have stricter per-user limits in the application).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # JSON requests are small; only the upload route below accepts a file (20 MB each, one per
    # request). Anything bigger, such as a 200 MB file, gets 413 here before reaching the API.
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    root /usr/share/nginx/html;

    location /api/ {
        include /etc/nginx/api_proxy.conf;
    }

    location ~ "^/api/projects/[0-9a-fA-F-]{36}/files$" {
        client_max_body_size 21m;
        include /etc/nginx/api_proxy.conf;
    }

    # The logo (PNG up to 2 MB).
    location ~ "^/api/projects/[0-9a-fA-F-]{36}/logo$" {
        client_max_body_size 3m;
        include /etc/nginx/api_proxy.conf;
    }

    # Up to 200 000 characters of text; a client that escapes Cyrillic as \uXXXX sends 6 bytes
    # per character.
    location ~ "^/api/projects/[0-9a-fA-F-]{36}/text$" {
        client_max_body_size 3m;
        include /etc/nginx/api_proxy.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
