# One command to run everything: `cp .env.example .env` (add the LLM key), then `docker compose up`.
# Only the `web` service publishes a port; everything else lives on the internal network.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

# The backend image is built once (by `api`) and reused by migrate and both workers.
x-backend: &backend
  <<: *hardening
  image: slides-generator/backend:local
  pull_policy: never
  volumes:
    - appdata:/data
  environment: &backend-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no']
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applies database migrations once, then exits; the API starts only after it succeeds.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    build: ./backend
    # Our images exist only locally: build (cached) instead of trying to pull them.
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  # "AI module": file parsing and LLM calls (I/O-bound → higher concurrency).
  worker-ai:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "ai", "-n", "ai@%h", "-c", "4", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # PPTX/MP4 rendering (CPU/RAM-heavy → low concurrency).
  worker-render:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "render", "-n", "render@%h", "-c", "2", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *hardening
    build: ./frontend
    image: slides-generator/web:local
    pull_policy: build
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
