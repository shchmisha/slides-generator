# One command to run everything: `cp .env.example .env` (add the LLM key), then `docker compose up`.
# Only the `web` service publishes a port; everything else lives on the internal network.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

# The backend image is built once (by `api`) and reused by migrate and both workers. The
# renderer has its own image (Node, headless Chromium, fonts, the pptx skill) and runs apart:
# no database or Redis credentials, and a network that only reaches the render worker.
x-backend: &backend
  <<: *hardening
  image: slides-generator/backend:local
  pull_policy: never
  volumes:
    - appdata:/data
  environment: &backend-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    <<: *hardening
    image: redis:7-alpine
    # The command starts with `sh`, so the image's entrypoint would not drop root by itself.
    # Nothing is persisted (--save "" --appendonly no), so the file system can be read-only.
    user: "999:1000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no']
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies database migrations once, then exits; the API starts only after it succeeds.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      <<: *backend-env
      # Only nginx can reach the API (no published port), so its forwarded client IP is trusted.
      FORWARDED_ALLOW_IPS: "*"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Empty means the default from app/config.py.
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-}
      MAX_BYTES_PER_USER: ${MAX_BYTES_PER_USER:-}
    # Our images exist only locally: build (cached) instead of trying to pull them.
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  # "AI module": file parsing and LLM calls. Waiting on the model is I/O, so five run at once:
  # the brief's "up to 5 concurrent generations".
  worker-ai:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "ai", "-n", "ai@%h", "-c", "5", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Render jobs: resolve the approved scenario, ask the renderer to build the file, store it.
  # Two at a time: headless Chromium is CPU-heavy, and more would only slow each other down on
  # a server without a GPU.
  worker-render:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "render", "-n", "render@%h", "-c", "2", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      RENDERER_URL: http://renderer:8000
    volumes:
      - appdata:/data
      - spool:/spool
    networks: [default, render]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      renderer:
        condition: service_healthy

  # Chromium runs here, and only here. Whatever a page could do, this container has nothing
  # to steal (no credentials in its environment, no user files but the job in the spool) and
  # nowhere to send it (its only network is `render`, which has no route out).
  renderer:
    <<: *hardening
    image: slides-generator/render:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: render
    pull_policy: build
    # Reaps Chromium's helper processes; /dev/shm is where Chromium keeps rendered pages.
    init: true
    shm_size: 512m
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RENDER_SLOTS: "2"
    volumes:
      - spool:/spool
    networks: [render]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *hardening
    build: ./frontend
    image: slides-generator/web:local
    pull_policy: build
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

networks:
  # The renderer's only network: just the render worker, no gateway to anywhere else.
  render:
    internal: true

volumes:
  pgdata:
  appdata:
  spool:
